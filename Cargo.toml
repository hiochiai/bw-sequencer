[package]
name = "bw-sequencer"
version = "0.1.1"
edition = "2021"
description = "A bandwidth sequencer to emulate dynamic network conditions for mobile IoT and vehicle-mounted devices."
license = "MIT"
repository = "https://github.com/hiochiai/bw-sequencer"
keywords = ["network", "emulator", "bandwidth", "tc", "iot", "sequencer"]
categories = ["command-line-utilities", "network-programming"]

[[bin]]
name = "bw-sequencer"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
csv = "1.3"
ctrlc = { version = "3.4", features = ["termination"] }
netlink-sys = "0.8"
serde = { version = "1.0", features = ["derive"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
